name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Verify linting
        run: pnpm lint

      - name: Verify workspace boundaries
        run: pnpm workspace:check

      - name: Verify types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start runtime dependencies
        run: docker compose up --detach --wait

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build all workspace packages
        run: pnpm build

      - name: Install the Chromium test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e:run

      - name: Stop runtime dependencies
        if: always()
        run: docker compose down
